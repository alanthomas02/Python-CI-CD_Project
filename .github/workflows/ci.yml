name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test Python application
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python syntax
        run: python -m py_compile app.py

      - name: Verify health endpoint logic
        run: |
          python - <<'PY'
          from app import AppHandler
          import json

          assert hasattr(AppHandler, "do_GET")
          print("Application handler exists.")
          print("Basic CI checks passed.")
          PY
